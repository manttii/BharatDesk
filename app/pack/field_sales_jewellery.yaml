# Sanity bounds: a value outside these is never auto-confirmed (and is flagged in the read-back).
# Integers only. Rates are per 10 g. Tune against real data.
bounds:
  weight_mg_min: 1000            # 1 g
  weight_mg_max: 50000000        # 50 kg
  value_paise_min: 10000         # Rs 100
  value_paise_max: 5000000000    # Rs 5 crore
  rate_paise_per_10g_min: 2000000    # Rs 20,000 per 10 g
  rate_paise_per_10g_max: 20000000   # Rs 2,00,000 per 10 g
  max_future_days: 365
  max_past_days: 400

# Domain words handed to speech-to-text as spelling hints (not instructions).
vocabulary: [kundan, jadau, polki, meenakari, tola, karat, "making charges", necklace, haar,
  "rani haar", mangalsutra, jhumka, bangles, kada, payal, chain, ring, bali, sets, advance,
  delivery, hallmark, "22 karat", "24 karat", "18 karat"]

months_en: [Jan, Feb, Mar, Apr, May, Jun, Jul, Aug, Sep, Oct, Nov, Dec]
