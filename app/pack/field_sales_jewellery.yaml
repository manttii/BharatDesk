# Pack for the ONE supported customer type: B2B gold/jewellery wholesaler field sales.
# Phase 0 carries only user-facing strings. Intents, required fields, sanity bounds and
# vocabulary are added in later phases.
# Strings are Roman-script Hindi ("Hinglish") to match the product brief's examples;
# switch to Devanagari here without touching code.
name: field_sales_jewellery
version: 1

