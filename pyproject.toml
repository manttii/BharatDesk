[project]
name = "bharatdesk"
version = "0.4.0"
requires-python = ">=3.11"
# ONLY what the Vercel-hosted dashboard needs: Vercel installs from this list, not from
# requirements.txt (which is the full set for the bot, the tests and CI). Every pin here must
# equal its pin in requirements.txt; tests/test_vercel_app.py enforces that.
dependencies = [
  "fastapi==0.162.0",
  "pydantic==2.13.5",
  "pydantic-settings==2.16.2",
  "SQLAlchemy[asyncio]==2.1.6",
  "greenlet==3.5.6",
  "asyncpg==0.32.0",
  "Jinja2==3.1.6",
  "PyYAML==6.0.3",
  "structlog==26.1.0",
  "python-multipart==0.0.33",
  "tzdata==2026.6",
  "gspread==6.2.1",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
filterwarnings = ["error::RuntimeWarning"]

[tool.ruff]
line-length = 100
target-version = "py311"
extend-exclude = ["migrations/versions"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "ASYNC", "S", "RUF"]
ignore = ["S101", "E501"]  # assert narrows types; `ruff format` owns line length

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S105", "S106", "S311", "E501", "RUF001"]  # long data tables; Devanagari digits
"app/pack/__init__.py" = ["E501"]

[tool.mypy]
python_version = "3.11"
strict = true
files = ["app", "scripts", "evals"]
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = ["alembic.*", "pypdfium2.*"]
ignore_missing_imports = true
