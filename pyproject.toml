[project]
name = "bharatdesk"
version = "0.1.0"
requires-python = ">=3.11"

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
filterwarnings = ["error::RuntimeWarning"]

[tool.ruff]
line-length = 100
target-version = "py311"
extend-exclude = ["migrations/versions"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "ASYNC", "S", "RUF"]
ignore = ["S101", "E501"]  # assert narrows types; `ruff format` owns line length

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S105", "S106", "S311", "E501", "RUF001"]  # long data tables; Devanagari digits
"app/pack/__init__.py" = ["E501"]

[tool.mypy]
python_version = "3.11"
strict = true
files = ["app", "scripts", "evals"]
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = ["alembic.*", "pypdfium2.*"]
ignore_missing_imports = true
